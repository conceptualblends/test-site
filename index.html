<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Link Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f3ef;
    --surface: #ffffff;
    --border: rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.15);
    --text: #1a1a1a;
    --text-muted: #888;
    --text-faint: #bbb;
    --radius: 12px;
    --toolbar-h: 60px;
    --card-w: 240px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    overflow: hidden;
  }

  /* ── Toolbar ── */
  #toolbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--toolbar-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 16px;
    z-index: 1000;
  }

  .tb-inputs {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }

  .tb-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  #board-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    border: none;
    outline: none;
    background: transparent;
    min-width: 50px;
    max-width: 200px;
    flex-shrink: 0;
    cursor: text;
    border-bottom: 1.5px solid transparent;
    padding: 2px 4px;
    transition: border-color 0.15s;
    font-family: 'DM Sans', sans-serif;
  }
  #board-title:hover { border-bottom-color: var(--border-strong); }
  #board-title:focus { border-bottom-color: var(--text); }
  #board-title::placeholder { color: var(--text-faint); }

  .tb-divider {
    width: 1px;
    height: 20px;
    background: var(--border-strong);
    flex-shrink: 0;
    margin: 0 2px;
  }

  #url-input {
    flex: 1;
    height: 36px;
    padding: 0 12px;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text);
    background: var(--bg);
    outline: none;
    transition: border-color 0.15s;
    min-width: 0;
  }
  #url-input::placeholder { color: var(--text-faint); }
  #url-input:focus { border-color: var(--text); background: #fff; }

  .tb-btn {
    height: 36px;
    padding: 0 14px;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    background: var(--surface);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.1s, transform 0.1s;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .tb-btn:hover { background: var(--bg); }
  .tb-btn:active { transform: scale(0.97); }
  .tb-btn.primary { background: var(--text); color: #fff; border-color: var(--text); }
  .tb-btn.primary:hover { background: #333; }
  .tb-btn.secondary { background: var(--bg); }

  /* ── Board & Canvas ── */
  #board {
    position: fixed;
    top: var(--toolbar-h);
    left: 0; right: 0; bottom: 0;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
  }

  #canvas {
    position: absolute;
    top: 0; left: 0;
    min-width: 100%;
    min-height: 100%;
  }

  .empty-state {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    margin-top: calc(var(--toolbar-h) / 2);
    text-align: center;
    pointer-events: none;
    user-select: none;
    width: 90%;
    max-width: 320px;
  }
  .empty-state .big { font-size: 32px; margin-bottom: 8px; opacity: 0.25; }
  .empty-state p { font-size: 14px; color: var(--text-faint); line-height: 2; }

  /* ── Cards ── */
  .link-card {
    position: absolute;
    width: var(--card-w);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: grab;
    user-select: none;
    transition: border-color 0.15s, box-shadow 0.15s, background 0.2s;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    touch-action: none;
  }
  .link-card:hover { border-color: var(--border-strong); box-shadow: 0 4px 20px rgba(0,0,0,0.07); }
  .link-card.dragging { cursor: grabbing; box-shadow: 0 8px 30px rgba(0,0,0,0.13); border-color: var(--border-strong); z-index: 999; }

  /* Colour variants */
  .link-card.c-yellow { background: #fffbeb; border-color: rgba(245,158,11,0.35); }
  .link-card.c-pink   { background: #fdf2f8; border-color: rgba(236,72,153,0.35); }
  .link-card.c-blue   { background: #eff6ff; border-color: rgba(59,130,246,0.35); }
  .link-card.c-green  { background: #f0fdf4; border-color: rgba(34,197,94,0.35); }
  .link-card.c-purple { background: #faf5ff; border-color: rgba(168,85,247,0.35); }
  .link-card.c-red    { background: #fef2f2; border-color: rgba(239,68,68,0.35); }
  .link-card.c-teal   { background: #f0fdfa; border-color: rgba(20,184,166,0.35); }

  /* Card header */
  .card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px 8px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .platform-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-instagram { background: #e1306c; }
  .dot-tiktok { background: #010101; }
  .dot-other { background: var(--text-faint); }
  .dot-text { background: #94a3b8; }

  .platform-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-muted);
    flex: 1;
  }

  .colour-swatches {
    display: flex;
    gap: 5px;
    align-items: center;
    flex-shrink: 0;
  }
  .swatch {
    width: 13px; height: 13px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.1s, border-color 0.1s;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .swatch:hover { transform: scale(1.25); }
  .swatch.active { border-color: var(--text) !important; }
  .swatch[data-c=""]       { background: #e5e5e5; border-color: #ccc !important; }
  .swatch[data-c="yellow"] { background: #f59e0b; }
  .swatch[data-c="pink"]   { background: #ec4899; }
  .swatch[data-c="blue"]   { background: #3b82f6; }
  .swatch[data-c="green"]  { background: #22c55e; }
  .swatch[data-c="purple"] { background: #a855f7; }
  .swatch[data-c="red"]    { background: #ef4444; }
  .swatch[data-c="teal"]   { background: #14b8a6; }

  .delete-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-faint);
    font-size: 18px;
    line-height: 1;
    padding: 0;
    width: 22px; height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.1s;
    flex-shrink: 0;
  }
  .delete-btn:hover { color: #d00; }

  .card-note {
    padding: 9px 12px 8px;
    border-bottom: 1px solid var(--border);
  }
  .card-note textarea {
    width: 100%;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--text);
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    line-height: 1.5;
    min-height: 18px;
    max-height: 110px;
    overflow-y: auto;
  }

  .text-body {
    padding: 10px 12px 10px;
  }
  .text-content-input {
    width: 100%;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--text);
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    line-height: 1.55;
    min-height: 56px;
    max-height: 220px;
    overflow-y: auto;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    gap: 8px;
  }
  .card-url-short {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-faint);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }

  .open-link {
    font-size: 12px;
    font-weight: 500;
    text-decoration: none;
    color: var(--text);
    padding: 4px 10px;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
  }

  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: #fff;
    font-size: 13px;
    padding: 10px 20px;
    border-radius: 8px;
    opacity: 0;
  }
  #toast.show { opacity: 1; }

</style>
</head>
